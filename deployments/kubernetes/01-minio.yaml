apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: fedroom
type: Opaque
stringData:
  MINIO_ROOT_USER: fedroomadmin
  MINIO_ROOT_PASSWORD: fedroomsecret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: fedroom
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: fedroom
spec:
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef: {name: minio-credentials}
          ports:
            - {containerPort: 9000, name: api}
            - {containerPort: 9001, name: console}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: minio-data}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: fedroom
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: fedroom
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio:9000 fedroomadmin fedroomsecret &&
              mc mb -p local/flaas-models &&
              mc mb -p local/mlflow-artifacts &&
              mc mb -p local/fedroom-client-data

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: fedroom
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: fedroom
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      containers:
        - name: mlflow
          image: fedroom/mlflow:latest   # build from Dockerfile.mlflow and push, or use a public mlflow image
          imagePullPolicy: IfNotPresent
          command:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:////mlflow/mlflow.db
            - --default-artifact-root
            - s3://mlflow-artifacts/
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
          env:
            - {name: MLFLOW_S3_ENDPOINT_URL, value: "http://minio:9000"}
            - {name: AWS_ACCESS_KEY_ID, value: fedroomadmin}
            - {name: AWS_SECRET_ACCESS_KEY, value: fedroomsecret}
          ports:
            - {containerPort: 5000}
          volumeMounts:
            - {name: data, mountPath: /mlflow}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mlflow-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: fedroom
spec:
  selector: {app: mlflow}
  ports:
    - {port: 5000, targetPort: 5000}
